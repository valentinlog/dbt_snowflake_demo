name: 'dbt_snowflake_demo'
version: '1.0'
config-version: 2

profile: 'dbt_snowflake_demo'

vars:
  surrogate_key_treat_nulls_as_empty_strings: true

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_snowflake_demo:

    +transient: false

    staging:
      +materialized: view
      +schema: STAGING
      +snowflake_warehouse: DBT_DEV_WH

    intermediate:
      +materialized: table
      +schema: INTERMEDIATE
      +snowflake_warehouse: DBT_QA_WH

    marts:
      +materialized: table
      +schema: MARTS
      +snowflake_warehouse: DBT_PROD_WH

seeds:
  dbt_snowflake_demo:
    +schema: RAW

    dim_date:
      +column_types:
        DATE_KEY: NUMBER(8,0)
        FULL_DATE: DATE
