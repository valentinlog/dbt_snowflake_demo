env_config:
  default_environment: dev

  environments:

    - name: dev
      env:
        DBT_WAREHOUSE: DBT_DEV_WH
        DBT_DATABASE: DBT_DEV_DB
        DBT_SCHEMA: STAGING
        DBT_ROLE: ACCOUNTADMIN

    - name: uat
      env:
        DBT_WAREHOUSE: DBT_UAT_WH
        DBT_DATABASE: DBT_UAT_DB
        DBT_SCHEMA: STAGING
        DBT_ROLE: ACCOUNTADMIN

    - name: prod
      env:
        DBT_WAREHOUSE: DBT_PRD_WH
        DBT_DATABASE: DBT_PRD_DB
        DBT_SCHEMA: STAGING
        DBT_ROLE: ACCOUNTADMIN