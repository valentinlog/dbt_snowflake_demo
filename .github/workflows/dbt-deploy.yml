name: dbt Deploy

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - uat
      - main

permissions:
  contents: read

env:
  DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.DBT_SNOWFLAKE_ACCOUNT }}
  DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
  DBT_SNOWFLAKE_PASSWORD: ${{ secrets.DBT_SNOWFLAKE_PASSWORD }}
  DBT_SNOWFLAKE_ROLE: ${{ secrets.DBT_SNOWFLAKE_ROLE }}

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt_packages
          key: ${{ runner.os }}-dbt-${{ hashFiles('packages.yml') }}

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.12.0

      - name: Check dbt version
        run: dbt --version

      - name: Set dbt target
        id: target
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "target=dev" >> "$GITHUB_OUTPUT"
              echo "Deploying to DEV"
              ;;
            uat)
              echo "target=uat" >> "$GITHUB_OUTPUT"
              echo "Deploying to UAT"
              ;;
            prod)
              echo "target=prod" >> "$GITHUB_OUTPUT"
              echo "Deploying to PROD"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Install dbt packages
        run: |
          dbt deps \
            --profiles-dir .

      - name: Run dbt build
        run: |
          dbt build \
            --profiles-dir . \
            --target ${{ steps.target.outputs.target }}
